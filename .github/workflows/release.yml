name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify release tag and successful CI provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be semantic versioned, got ${RELEASE_TAG}."
            exit 1
          fi

          version="$(awk '/^## Version / { print $3; exit }' RELEASE_NOTES.md)"
          expected_tag="v${version#v}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match top RELEASE_NOTES.md version ${expected_tag}."
            exit 1
          fi

          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "${tag_sha}" != "${head_sha}" ]]; then
            echo "::error::Checked-out HEAD ${head_sha} does not match ${RELEASE_TAG} commit ${tag_sha}."
            exit 1
          fi

          successful_runs="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yaml/runs" \
              -f event=push \
              -f head_sha="${head_sha}" \
              -f status=completed \
              -f per_page=100 \
              --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "push" and .head_branch == "main")] | length'
          )"
          if [[ "${successful_runs}" -lt 1 ]]; then
            echo "::error::No successful completed push CI run exists on main for ${head_sha}."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Verify generated contract artifacts
        run: go run ./cmd/contractgen --check

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "v2.17.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
