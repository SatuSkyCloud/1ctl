name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches:
      - main
      - development
      - feature/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Public pull requests execute repository-controlled code, so CI always uses
# isolated GitHub-hosted runners. Release workflows follow the same policy.

jobs:
  contract:
    name: Contract Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Verify generated contract artifacts
        run: go run ./cmd/contractgen --check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Verify dependencies
        run: go mod download && go mod verify

      - name: Run tests
        env:
          SATUSKY_BACKEND_MANIFEST: ${{ vars.SATUSKY_BACKEND_MANIFEST }}
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0

      - name: Run linters
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          golangci-lint run ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install pinned security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan source and dependencies
        run: |
          gosec -quiet ./...
          gitleaks dir . --redact --no-banner
          govulncheck ./...

  build:
    name: Build Linux AMD64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [contract, test, lint, security]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o bin/1ctl ./cmd/1ctl

      - name: Test binary
        run: ./bin/1ctl --version
