name: Auto Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

# Creates the next release tag from the top RELEASE_NOTES.md entry. The
# successful main CI commit is tagged exactly; the tag-triggered release
# workflow is the single publisher for binaries and contract artifacts.
#
# The tag is pushed with a dedicated token (RELEASE_TAG_TOKEN) rather than the
# default GITHUB_TOKEN: GitHub does not create new workflow runs for events
# triggered by GITHUB_TOKEN, so a GITHUB_TOKEN tag push would never trigger the
# release.yml tag workflow. A PAT/App token push does trigger it.

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - name: Resolve release tag
        id: release
        env:
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse HEAD)" != "${CI_HEAD_SHA}" ]]; then
            echo "::error::Checkout HEAD does not match the commit that passed CI."
            exit 1
          fi

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "${main_sha}" != "${CI_HEAD_SHA}" ]]; then
            echo "::error::origin/main advanced after CI; refusing to tag stale commit ${CI_HEAD_SHA}."
            exit 1
          fi

          version="$(awk '/^## Version / { print $3; exit }' RELEASE_NOTES.md)"
          tag="v${version#v}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Top RELEASE_NOTES.md version must be semver, got: ${version}"
            exit 1
          fi

          tag_commit="$(git ls-remote --tags origin "refs/tags/${tag}^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "${tag_commit}" ]]; then
            tag_commit="$(git ls-remote --tags origin "refs/tags/${tag}" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ -n "${tag_commit}" && "${tag_commit}" != "${CI_HEAD_SHA}" ]]; then
            echo "::error::Release tag ${tag} already points to ${tag_commit}, not ${CI_HEAD_SHA}."
            exit 1
          fi
          if [[ -n "${tag_commit}" ]]; then
            echo "Release tag ${tag} already points to the successful CI commit; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: steps.release.outputs.skip != 'true'
        env:
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "${main_sha}" != "${CI_HEAD_SHA}" ]]; then
            echo "::error::origin/main advanced before tagging; refusing to tag stale commit ${CI_HEAD_SHA}."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${CI_HEAD_SHA}" -m "Release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
