name: Auto Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

# Creates the next release tag from the top RELEASE_NOTES.md entry. The
# successful main CI commit is tagged exactly; the tag-triggered release
# workflow is the single publisher for binaries and contract artifacts.

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(awk '/^## Version / { print $3; exit }' RELEASE_NOTES.md)"
          tag="v${version#v}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Top RELEASE_NOTES.md version must be semver, got: ${version}"
            exit 1
          fi

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Release tag ${tag} already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: steps.release.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.release.outputs.tag }}" -m "Release ${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"
