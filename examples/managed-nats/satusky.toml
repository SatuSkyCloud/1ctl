[app]
name = "guide-nats-client"
port = 8080
cpu_request = "100m"
cpu_limit = "500m"
memory = "256Mi"
replicas = 1

[build]
dockerfile = "Dockerfile"

[checks]
health_path = "/health"

# The readiness probe runs inside the cluster, so `1ctl deploy --wait` can
# verify the app answers without waiting on public DNS. health_path alone is
# only checked over the public URL, which is not ready until DNS propagates.
[checks.readiness]
  initial_delay_seconds = 2
  timeout_seconds       = 2
  period_seconds        = 5

[checks.readiness.http_get]
  path = "/health"
  port = 8080
