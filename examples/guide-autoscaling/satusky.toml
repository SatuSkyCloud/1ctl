[app]
  name        = "guide-autoscale-nginx"
  port        = 8080
  cpu_request = "10m"
  cpu_limit   = "250m"
  memory      = "64Mi"
  replicas    = 1

[build]
  image = "nginxinc/nginx-unprivileged:1.27.5-alpine"

[checks]
  health_path = "/"

[hpa]
  enabled       = true
  min_replicas  = 1
  max_replicas  = 3
  cpu_target    = 20
  memory_target = 0
