# A small, production-shaped marketplace package example.
#
# The image digest is already deployed successfully on Satusky's rentable ARM64
# worker. IT-Tools is a stateless web application, so this package deliberately
# does not declare a persistent volume.

[app]
name        = "marketplace-it-tools-gateway"
port        = 8080
cpu_request = "50m"
cpu_limit   = "200m"
memory      = "128Mi"
replicas    = 1

[build]
# Immutable, pullable from the Satusky registry; do not replace with a tag.
image       = "registry.satusky.com/satusky-container-registry/it-tools@sha256:05f6bd8576daa6823e37971b1efbdec63c93a3ab3aac9678c6be19b2845ecab7"
target_arch = "arm64"

[checks.startup]
initial_delay_seconds = 2
timeout_seconds       = 2
period_seconds        = 5
failure_threshold     = 12
[checks.startup.http_get]
path = "/"
port = 8080

[checks.readiness]
timeout_seconds   = 2
period_seconds    = 5
failure_threshold = 3
[checks.readiness.http_get]
path = "/"
port = 8080

[checks.liveness]
timeout_seconds   = 2
period_seconds    = 10
failure_threshold = 3
[checks.liveness.http_get]
path = "/"
port = 8080
