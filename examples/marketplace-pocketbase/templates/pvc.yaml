apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.satusky.appName }}-data
  namespace: {{ .Values.satusky.namespace }}
  labels:
    app.kubernetes.io/name: pocketbase
    app.kubernetes.io/instance: {{ .Values.satusky.appName }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi
