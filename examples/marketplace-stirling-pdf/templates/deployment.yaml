apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.satusky.appName }}
  namespace: {{ .Values.satusky.namespace }}
  labels:
    app.kubernetes.io/name: stirling-pdf
    app.kubernetes.io/instance: {{ .Values.satusky.appName }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stirling-pdf
      app.kubernetes.io/instance: {{ .Values.satusky.appName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stirling-pdf
        app.kubernetes.io/instance: {{ .Values.satusky.appName }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-persistent-directories
          image: registry.satusky.com/satusky-container-registry/stirling-pdf@sha256:1b7a5a9739b605f5fa03e8f858ef312a0f06d46c8f19be2698a22a6206647763
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - mkdir -p /data/trainingData /data/extraConfigs /data/customFiles /data/logs /data/pipeline /data/storage
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: stirling-pdf
          image: registry.satusky.com/satusky-container-registry/stirling-pdf@sha256:1b7a5a9739b605f5fa03e8f858ef312a0f06d46c8f19be2698a22a6206647763
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCKER_ENABLE_SECURITY
              value: "true"
            - name: SYSTEM_DEFAULTLOCALE
              value: en-US
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /configs/trainingData
              subPath: trainingData
            - name: data
              mountPath: /configs/extraConfigs
              subPath: extraConfigs
            - name: data
              mountPath: /customFiles
              subPath: customFiles
            - name: data
              mountPath: /logs
              subPath: logs
            - name: data
              mountPath: /pipeline
              subPath: pipeline
            - name: data
              mountPath: /usr/share/tessdata
              subPath: storage
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.satusky.appName }}-data
